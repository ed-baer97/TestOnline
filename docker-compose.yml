name: testonline

services:
  web:
    build:
      context: .
      target: web
    image: testonline-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media:/data/media:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    image: testonline-app
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env}
      POSTGRES_URL: postgresql://testonline:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@postgres:5432/testonline
      PG_SSL: "0"
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      MEDIA_DIR: /data/media
      MEDIA_ACCEL: "1"
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      LESSON_MAX_ATTEMPTS: ${LESSON_MAX_ATTEMPTS:-1}
      SUPER_LOGIN: ${SUPER_LOGIN:-super}
      SUPER_PASSWORD: ${SUPER_PASSWORD:-super12345}
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${APP_REPLICAS:-1}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: testonline
      POSTGRES_USER: testonline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testonline -d testonline"]
      interval: 5s
      timeout: 3s
      retries: 20

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: testonline
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: testonline
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
  backups:
