upstream testonline_app {
    server app:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Внутренний адрес для X-Accel-Redirect: сюда Node перенаправляет отдачу медиа после проверки прав.
    location /media-internal/ {
        internal;
        alias /data/media/;
    }

    location /api/ {
        proxy_pass http://testonline_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://testonline_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# HTTPS: положите сертификаты в deploy/certs (fullchain.pem, privkey.pem), раскомментируйте блок,
# в docker-compose.yml откройте порт 443 и смонтируйте deploy/certs в /etc/nginx/certs:ro.
